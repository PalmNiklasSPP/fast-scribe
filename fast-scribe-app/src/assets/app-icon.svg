<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="fast-scribe icon">
  <defs>
    <linearGradient id="centerFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C8FF"/>
      <stop offset="42%" stop-color="#A765FF"/>
      <stop offset="100%" stop-color="#5A16D8"/>
    </linearGradient>
    <linearGradient id="centerRight" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#7A2BEA"/>
      <stop offset="60%" stop-color="#5B16D4"/>
      <stop offset="100%" stop-color="#3C0E99"/>
    </linearGradient>
    <linearGradient id="centerTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E7FF"/>
      <stop offset="55%" stop-color="#C79BFF"/>
      <stop offset="100%" stop-color="#8A49EF"/>
    </linearGradient>
    <linearGradient id="centerBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7440D9"/>
      <stop offset="100%" stop-color="#35107E"/>
    </linearGradient>

    <linearGradient id="sideLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D8FF"/>
      <stop offset="50%" stop-color="#B979FF"/>
      <stop offset="100%" stop-color="#6730DB"/>
    </linearGradient>
    <linearGradient id="sideDark" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7F39EE"/>
      <stop offset="100%" stop-color="#4313A4"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- subtle purple glow, still fully transparent outside -->
  <g opacity="0.16" filter="url(#softGlow)">
    <path d="M512 90 L680 250 L680 770 L512 934 L344 770 L344 250 Z" fill="#7A2BEA"/>
    <path d="M140 470 L300 300 L300 730 L170 620 Z" fill="#8D4BFF"/>
    <path d="M884 470 L724 320 L724 730 L854 620 Z" fill="#8D4BFF"/>
  </g>

  <!-- left shard -->
  <g>
    <path d="M140 470 L300 300 L300 730 L170 620 Z" fill="url(#sideLight)"/>
    <path d="M140 470 L250 535 L300 300 Z" fill="#E7C8FF"/>
    <path d="M250 535 L300 730 L300 300 Z" fill="url(#sideDark)"/>
    <path d="M140 470 L170 620 L300 730 L250 535 Z" fill="#6E31D9"/>
    <path d="M140 470 L300 300 L250 535 Z" fill="#F2E2FF" opacity="0.72"/>
  </g>

  <!-- center shard -->
  <g>
    <path d="M512 90 L680 250 L680 770 L512 934 L344 770 L344 250 Z" fill="url(#centerFace)"/>
    <path d="M512 90 L680 250 L548 290 Z" fill="url(#centerTop)"/>
    <path d="M548 290 L680 250 L680 770 L548 790 Z" fill="url(#centerRight)"/>
    <path d="M344 250 L512 90 L548 290 L470 705 L344 770 Z" fill="url(#centerFace)"/>
    <path d="M344 770 L470 705 L512 934 Z" fill="url(#centerBottom)"/>
    <path d="M470 705 L548 790 L512 934 Z" fill="#4D169F"/>
    <path d="M548 290 L470 705" stroke="#D8B6FF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M512 90 L548 290" stroke="#F3E8FF" stroke-width="5" stroke-linecap="round" opacity="0.92"/>
  </g>

  <!-- right shard -->
  <g>
    <path d="M884 470 L724 320 L724 730 L854 620 Z" fill="url(#sideLight)"/>
    <path d="M884 470 L774 545 L724 320 Z" fill="#E7C8FF"/>
    <path d="M774 545 L724 730 L724 320 Z" fill="url(#sideDark)"/>
    <path d="M884 470 L854 620 L724 730 L774 545 Z" fill="#6E31D9"/>
    <path d="M884 470 L724 320 L774 545 Z" fill="#F2E2FF" opacity="0.72"/>
  </g>
</svg>
