instructions: |
  The Electron application lives in fast-scribe-app. Run its npm scripts from that directory.

scripts:
  - name: Setup desktop app
    command: Set-Location fast-scribe-app; npm ci
    triggers:
      - session.create
  - name: Run desktop app
    command: Set-Location fast-scribe-app; npm run dev

server_ready_pattern: '(?i)Local:\s+(https?://\S+)'
